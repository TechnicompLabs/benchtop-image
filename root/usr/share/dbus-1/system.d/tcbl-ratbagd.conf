<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- Technicomp Benchtop Linux: every user may use ratbagd (Piper, ratbagctl), as
     upstream libratbag allows by default. openSUSE builds ratbagd for members of
     the games group only (bsc#1210669). -->
<busconfig>
        <policy context="default">
                <allow send_destination="org.freedesktop.ratbag1"/>
                <allow receive_sender="org.freedesktop.ratbag1"/>
        </policy>
</busconfig>
